<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/live.css">
</head>
<body class="live-body">

    <div class="live-header">
        <a href="../portals/student_portal.html" class="back-link">← Leave Session</a>
        <h2>Mathematics - Chapter 4 (Live)</h2>
        <div class="status-badge"><span class="dot"></span> LIVE</div>
    </div>

    <div class="classroom-container">
        <!-- Whiteboard Area -->
        <div class="whiteboard-wrapper">
            <div class="whiteboard">
                <p>Interactive Whiteboard</p>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="action-bar">
            <button class="action-btn" id="btnRaiseHand">
                <span class="icon">✋</span>
                Raise Hand
            </button>
            <button class="action-btn" id="btnAskDoubt">
                <span class="icon">❓</span>
                Ask Doubt
            </button>
            <button class="action-btn primary-btn" id="btnSubmitAnswer">
                <span class="icon">📝</span>
                Submit Answer
            </button>
        </div>
    </div>
    
    <!-- Interaction Modal -->
    <div id="interactionModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Action</h3>
            <textarea id="modalInput" rows="4" placeholder="Type your message here..."></textarea>
            <div class="modal-actions">
                <button id="cancelModal">Cancel</button>
                <button id="sendModal" class="primary-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO -> Relay live classes -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="../js/live.js"></script>
</body>
</html>
