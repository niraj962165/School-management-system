<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Alies Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: var(--font-main);
            padding: 2rem 5%;
            display: flex;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 3rem;
            box-shadow: var(--shadow-md);
            margin-top: 2rem;
        }

        .header-actions {
            margin-bottom: 2rem;
            text-align: left;
        }

        .header-actions h1 {
            color: #f8fafc;
            font-size: 2rem;
            margin-top: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: white;
            transform: translateX(-4px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            color: white;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }

        /* Option colors in select dropdown */
        .form-group select option {
            background-color: var(--bg-dark);
            color: white;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

    </style>
</head>
<body>
    <div class="form-container">
        <div class="header-actions">
            <a href="admin_portal.html" class="back-btn">← Back to Dashboard</a>
            <h1>Enroll Student</h1>
            <p style="color: rgba(255,255,255,0.6);">Add a new student profile directly into the system records</p>
        </div>

        <form id="addStudentForm">
            <div class="form-group">
                <label for="id">Student ID</label>
                <input type="text" id="id" required placeholder="e.g. S101">
            </div>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter student's full name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="student_class">Class (Grade)</label>
                    <select id="student_class" required>
                        <option value="" disabled selected>Select Grade</option>
                        <option value="9">Grade 9</option>
                        <option value="10">Grade 10</option>
                        <option value="11">Grade 11</option>
                        <option value="12">Grade 12</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="section">Section</label>
                    <select id="section" required>
                        <option value="" disabled selected>Select Section</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="roll_no">Assigned Roll Number</label>
                <input type="number" id="roll_no" required placeholder="e.g. 15">
            </div>

            <div class="form-group">
                <label for="password">Portal Password</label>
                <input type="password" id="password" required placeholder="Assign a secure password">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Enroll Student</button>
        </form>
    </div>

    <script>
        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Communicating with DB...';
            btn.disabled = true;

            const payload = {
                id: document.getElementById('id').value,
                name: document.getElementById('name').value,
                student_class: document.getElementById('student_class').value,
                section: document.getElementById('section').value,
                roll_no: document.getElementById('roll_no').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/admin/student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if(data.success) {
                    btn.style.backgroundColor = '#10b981';
                    btn.innerText = 'Enrollment Successful!';
                    document.getElementById('addStudentForm').reset();
                    setTimeout(() => {
                        window.location.href = 'student_data.html';
                    }, 1500);
                } else {
                    alert('Registration Failed: ' + data.message);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch(error) {
                console.error("Error submitting:", error);
                alert('Backend Communication Error!');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
