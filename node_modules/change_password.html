<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Alies Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: var(--font-main);
            padding: 2rem 5%;
            display: flex;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 3rem;
            box-shadow: var(--shadow-md);
            margin-top: 4rem;
        }

        .header-actions {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header-actions h1 {
            color: #f8fafc;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            color: white;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="header-actions">
            <h1>🔒 Security Settings</h1>
            <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">
                You may change your password up to <strong>3 times per month</strong>.
            </p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="changePasswordForm">
            <div class="form-group">
                <label for="oldPassword">Current Password</label>
                <input type="password" id="oldPassword" required placeholder="Enter active password">
            </div>
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required placeholder="Create a strong password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required placeholder="Verify new password">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Update Password</button>
        </form>

        <a href="#" id="backBtn" class="back-link">Return to Dashboard</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let activeUser = null;
            let activeRole = null;
            let portalLink = '';

            // Detect Context Context From LocalStorage
            if (localStorage.getItem('currentAdmin')) {
                activeUser = JSON.parse(localStorage.getItem('currentAdmin'));
                activeRole = 'admin';
                portalLink = 'admin_portal.html';
            } else if (localStorage.getItem('currentTeacher')) {
                activeUser = JSON.parse(localStorage.getItem('currentTeacher'));
                activeRole = 'teacher';
                portalLink = 'faculty_portal.html';
            } else if (localStorage.getItem('currentStudent')) {
                activeUser = JSON.parse(localStorage.getItem('currentStudent'));
                activeRole = 'student';
                portalLink = 'student_portal.html';
            } else {
                window.location.href = '../auth/login.html'; // No context
            }

            // Set back button link
            document.getElementById('backBtn').href = portalLink;

            const form = document.getElementById('changePasswordForm');
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('submitBtn');

            function showAlert(msg, isError = true) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
                alertBox.innerHTML = msg;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const oldPassword = document.getElementById('oldPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if(newPassword !== confirmPassword) {
                    return showAlert("New passwords do not match. Please verify.");
                }

                if(newPassword.length < 6) {
                    return showAlert("New password must be at least 6 characters long.");
                }

                const originalText = btn.innerText;
                btn.innerText = 'Verifying Integrity...';
                btn.disabled = true;

                try {
                    const response = await fetch('/api/change-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: activeUser.id,
                            role: activeRole,
                            oldPassword: oldPassword,
                            newPassword: newPassword
                        })
                    });
                    
                    const data = await response.json();
                    
                    if(response.ok && data.success) {
                        showAlert("✅ Password has been successfully updated!", false);
                        form.reset();
                        btn.style.backgroundColor = '#10b981';
                        btn.innerText = 'Lock Active';
                        setTimeout(() => {
                            window.location.href = portalLink;
                        }, 2000);
                    } else {
                        // Backend failure like Incorrect Password or Monthly Limit Exceeded
                        showAlert("❌ " + data.message);
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                } catch(error) {
                    console.error("Communication error", error);
                    showAlert("❌ Communication fault with primary server.");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
