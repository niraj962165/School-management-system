<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory - Alies Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: var(--font-main);
            padding: 2rem 5%;
        }

        .directory-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }

        .header-actions h1 {
            color: #f8fafc;
            font-size: 2.2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: white;
            transform: translateX(-4px);
        }

        .data-table-wrapper {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            background: rgba(0,0,0,0.2);
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255,255,255,0.02);
        }

        .student-name {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #f8fafc;
        }

        .avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .badge-class {
            background: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: var(--primary);
        }

        .loader {
            padding: 3rem;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-style: italic;
        }

    </style>
</head>
<body>
    <div class="directory-container">
        <div class="header-actions">
            <div>
                <a href="admin_portal.html" class="back-btn">← Back to Dashboard</a>
                <h1 style="margin-top: 10px;">Student Directory</h1>
            </div>
            <a href="add_student.html" class="action-btn" style="text-decoration: none; font-weight: 600;">+ Add Student</a>
        </div>

        <div class="data-table-wrapper">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Student ID</th>
                        <th>Class & Section</th>
                        <th>Roll Number</th>
                        <th>Verification</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentBody">
                    <tr><td colspan="6" class="loader">Loading database records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('studentBody');
            
            try {
                const response = await fetch('/api/admin/students');
                const data = await response.json();

                if(data.success && data.students.length > 0) {
                    tbody.innerHTML = '';
                    data.students.forEach(student => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div class="student-name">
                                    <div class="avatar-sm">🎓</div>
                                    ${student.name}
                                </div>
                            </td>
                            <td style="color: rgba(255,255,255,0.7); font-family: monospace;">${student.id}</td>
                            <td><span class="badge-class">Grade ${student.class} - ${student.section}</span></td>
                            <td style="font-weight: 600;">${student.roll_no}</td>
                            <td><span style="color: #34d399; font-size: 0.9rem;">✔️ Enrolled</span></td>
                            <td><button class="action-btn" onclick="alert('Viewing detailed transcript & attendance for ${student.name}')">View Record</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="loader">No student records found in system.</td></tr>';
                }

            } catch(error) {
                console.error("Error fetching students:", error);
                tbody.innerHTML = '<tr><td colspan="6" class="loader" style="color: #ef4444;">Failed to connect to backend database.</td></tr>';
            }
        });
    </script>
</body>
</html>
