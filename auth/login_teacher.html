<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Alies International</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/app1.css">
</head>
<body class="auth-body">

    <div class="login-circles"></div>
    <div class="login-circles-right"></div>

    <div class="login-card">
        <h1>Faculty Login 👨‍🏫</h1>
        <p>Please enter your credentials to continue</p>
        
        <form id="teacherLoginForm" class="auth-form">
            <div class="form-group">
                <label for="loginId">Faculty ID</label>
                <input type="text" id="loginId" required placeholder="Enter your ID (e.g., T101)">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="auth-submit-btn">Login</button>
        </form>

        <a href="../auth/login.html" class="back-link">
            <span>←</span> Back to Login Options
        </a>
    </div>

    <a href="#" class="help-btn" onclick="alert('Support form opened')">
        <span>❓</span> Need Help?
    </a>

    <script>
        document.getElementById('teacherLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('.auth-submit-btn');
            const originalText = submitBtn.textContent;
            
            try {
                submitBtn.textContent = 'Verifying...';
                submitBtn.disabled = true;

                const response = await fetch('/api/login/teacher', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ loginId, password })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('loggedInUser', JSON.stringify(data.teacher));
                    sessionStorage.setItem('userRole', 'teacher');
                    
                    submitBtn.style.backgroundColor = '#10b981';
                    submitBtn.textContent = 'Access Granted!';
                    
                    setTimeout(() => {
                        window.location.href = '../portals/faculty_portal.html';
                    }, 800);
                } else {
                    // Fail prompt
                    alert('Login Failed: ' + data.message);
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error during login:', error);
                alert('A network error occurred. Please make sure the server is running.');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
